name: Migrations Applied Check

# Why this exists:
# Vercel deploys the front-end on merge to main, and deploy-edge-functions.yml
# deploys edge functions — but NOTHING applies database migrations. So a PR can
# add a migration plus front-end code that needs it, merge, and ship the
# front-end live against a schema that doesn't have the change yet. That is
# exactly what broke the Settings save in June 2026 (PR #221 added
# salon_config.settings and went live before the column existed; see
# 20260604120000_add_salon_config_settings.sql).
#
# This check fails when a PR ADDS a migration that prod has not applied yet,
# forcing the safe order: apply the migration to the live project BEFORE the
# code that depends on it can merge (and therefore deploy).
#
# To actually BLOCK merges, mark the "migrations-applied" job as a required
# status check in branch protection for main. The job always runs (no paths
# filter) and self-skips when a change touches no migrations, so it never
# leaves a required check stuck "waiting".
#
# Matching note: a migration counts as applied if its 14-digit version, its
# name (the part after the timestamp), OR its full basename appears in prod's
# supabase_migrations.schema_migrations. The name fallback is deliberate —
# applying via the Supabase MCP (apply_migration) records its own timestamp, so
# versions drift from the files; the name still matches. The basename form was
# added 7 September 2026 after #790 was applied with the whole filename as its
# name (20260906120000_late_reminder_pass): the cron jobs were live, but this
# check and the daily drift audit both reported it PENDING. Timestamps are
# unique per file (scripts/check-migrations.mjs enforces that), so a basename
# can only have come from applying that file — no false positive is possible.
# It also only checks migrations this change *adds* (diff vs the base), so
# historical drift on old files never trips it.
#
# Content note (6 October 2026): a name match is necessary, not sufficient.
# The production apply workflow (production-apply-migrations.yml) records the
# whole committed file as the last element of the row's `statements`, so for
# every added file this check also compares that recorded SQL with the file in
# the pull request (trailing whitespace aside) and fails on a difference: a
# file edited after it was applied, or a pull request head pushed after the
# apply, cannot merge under the applied name. A row that recorded no SQL
# (applied and ledgered by hand) is still matched by name alone.
#
# Secret required:
#   SUPABASE_ACCESS_TOKEN — the same token deploy-edge-functions.yml uses.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Same reasoning as ci.yml: one in-flight run per branch, superseded pull-request
# runs cancelled, main runs always allowed to finish. This check runs on every
# pull-request push too, so it was multiplying alongside CI.
concurrency:
  group: migrations-applied-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  migrations-applied:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_PROJECT_REF: nlzhllhkigmsvrzduefz
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          # Need history to diff this change against its base.
          fetch-depth: 0

      - name: Work out which migrations this change ADDS
        id: added
        shell: bash
        env:
          # Pass GitHub context through env (never interpolate ${{ }} straight
          # into run: — injection risk), matching deploy-edge-functions.yml.
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            range="origin/${BASE_REF}...HEAD"
          else
            if [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              range="$(git rev-parse HEAD^ 2>/dev/null || echo HEAD)...HEAD"
            else
              range="${BEFORE_SHA}...HEAD"
            fi
          fi

          added=$(git diff --name-only --diff-filter=A "$range" -- supabase/migrations/ | grep '\.sql$' || true)
          echo "Migration files added in $range:"
          echo "${added:-  (none)}"

          {
            echo "files<<EOF"
            echo "$added"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: No new migrations
        if: steps.added.outputs.files == ''
        run: echo "This change adds no migrations — nothing to verify. ✅"

      - name: Verify added migrations are applied on prod
        if: steps.added.outputs.files != ''
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ADDED_FILES: ${{ steps.added.outputs.files }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN isn't available in this run, so applied migrations can't be verified."
            echo "A Dependabot PR shouldn't be adding migrations; for anything else, ensure the secret is set."
            exit 1
          fi

          # Only valid migration filenames take part: their version, name and
          # basename are quoted into the query below, so nothing else may be.
          in_versions=""
          in_names=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            base=$(basename "$f" .sql)
            if [[ ! "$base" =~ ^[0-9]{14}_[a-z0-9_]+$ ]]; then
              echo "::error::$f is not a valid migration filename (<14-digit version>_<snake_case_name>.sql); scripts/check-migrations.mjs refuses it too."
              exit 1
            fi
            in_versions="${in_versions:+$in_versions,}'${base%%_*}'"
            in_names="${in_names:+$in_names,}'${base#*_}','$base'"
          done <<< "$ADDED_FILES"

          # Read prod's applied migration history via the Supabase Management API
          # (same endpoint the MCP uses — no DB password needed). Rows this change
          # could match also carry the SQL last recorded against them (the last
          # element of statements, which the production apply workflow stores as
          # the whole committed file), so the applied content can be compared.
          query="select version, name, case when version in ($in_versions) or name in ($in_names) then statements[array_upper(statements, 1)] end as recorded_sql from supabase_migrations.schema_migrations"
          resp=$(curl -sS -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$(jq -cn --arg query "$query" '{query: $query}')")

          # Tolerate either a bare array or a {result:[...]} wrapper; fail loudly otherwise.
          rows=$(echo "$resp" | jq -c 'if type=="array" then . elif (type=="object" and has("result")) then .result else empty end' 2>/dev/null || true)
          if [ -z "$rows" ]; then
            echo "::error::Couldn't read prod migration history. API response was:"
            echo "$resp"
            exit 1
          fi

          applied_versions=$(echo "$rows" | jq -r '.[].version // empty')
          applied_names=$(echo "$rows" | jq -r '.[].name // empty')

          pending=()
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            base=$(basename "$f" .sql)   # 20260604120000_add_salon_config_settings
            ver=${base%%_*}              # 20260604120000
            name=${base#*_}              # add_salon_config_settings
            if grep -qxF "$ver" <<<"$applied_versions" || grep -qxF "$name" <<<"$applied_names" || grep -qxF "$base" <<<"$applied_names"; then
              # Applied by name. Now the content: among the rows this file
              # matches, one that recorded SQL must have recorded this file
              # (trailing whitespace aside). A row with no recorded SQL (applied
              # by hand, ledger row inserted by hand) can only be matched by
              # name. The file is read by jq itself, never passed as an argument.
              verdict=$(echo "$rows" | jq -r --arg ver "$ver" --arg name "$name" --arg base "$base" --rawfile file "$f" '
                [.[] | select(.version == $ver or .name == $name or .name == $base) | (.recorded_sql // "") | sub("\\s+$"; "")]
                | map(select(length > 0))
                | if length == 0 then "unrecorded"
                  elif any(. == ($file | sub("\\s+$"; ""))) then "match"
                  else "differs" end')
              case "$verdict" in
                match)      echo "✓ applied: $base (the SQL prod recorded for it equals this file)" ;;
                unrecorded) echo "✓ applied: $base (matched by name; prod recorded no SQL to compare)" ;;
                *)
                  echo "✗ CONTENT MISMATCH: $base"
                  echo "    prod recorded different SQL for this migration than this file holds. History is append-only:"
                  echo "    re-apply the committed content with the production workflow (reapply input), or put back what was applied."
                  pending+=("$base")
                  ;;
              esac
            else
              echo "✗ PENDING: $base"
              echo "    apply it with name: $name   (derived by scripts/migration-name.mjs)"
              pending+=("$base")
            fi
          done <<< "$ADDED_FILES"

          if [ ${#pending[@]} -gt 0 ]; then
            echo
            echo "::error::This PR adds migration(s) not applied to prod as committed: ${pending[*]}"
            echo "Apply them to the live project BEFORE merging — they are NOT auto-applied on deploy."
            echo "Use the production migration workflow (Actions → Apply named migrations to production; docs/migrations.md),"
            echo "which records the SQL it applied so this check can compare it, then re-run this check."
            exit 1
          fi

          echo
          echo "All added migrations are applied on prod as committed. ✅"
