name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Validate migrations
        run: node scripts/check-migrations.mjs
      - run: npm run test
      - run: npm run build

  agent-tests:
    # Dispatch-contract tests for the whatsapp-agent Edge Function run
    # under Deno (the function's own runtime), not vitest — see
    # supabase/functions/whatsapp-agent/__tests__/dispatch.test.ts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # --node-modules-dir=none: the repo's package.json otherwise makes
      # Deno expect an installed node_modules for npm type resolution,
      # and this job deliberately never runs npm ci.
      - run: deno test --node-modules-dir=none --allow-env supabase/functions/whatsapp-agent/__tests__/

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
