name: CI

# Required Protect main checks must report on every PR, including website-only
# changes. Application isolation belongs in tooling, not workflow path skips.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One in-flight run per branch: pushing again to a pull request supersedes the
# previous run instead of racing it. Without this, every push started a full
# 18-billed-minute run and nothing stopped the one it replaced. On 12 September
# a single pull request took five CI runs in forty minutes, two of them still
# occupying runners when their successor started — ninety billed minutes to
# test four commits, only the last of which anyone was waiting on.
#
# Deliberately NOT cancelling on main. A push there is the commit that
# auto-deploys production, and its run is the only evidence the deployed tree
# was green; a fast second merge must not erase the first one's result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Static analysis and the production build. The Vitest suite is NOT run
    # here: `coverage` below runs the very same `vitest run` with V8
    # instrumentation, so having both jobs run it executed all 3,568 tests
    # twice per pull request for one extra signal — six of the eighteen billed
    # minutes a pull request cost.
    #
    # Splitting coverage out was originally about keeping this job's critical
    # path short. Dropping the duplicate serves that better, not worse: this
    # job now reports lint, docs, types, migrations and the build in about
    # ninety seconds instead of six minutes, and `coverage` remains the long
    # pole it already was. Both are required checks, so the combined gate is
    # unchanged — only the duplication is gone.
    #
    # The local bar in CLAUDE.md is unaffected: `npm run test` is still what a
    # contributor runs before pushing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:docs
      - run: npm run typecheck
      - name: Validate migrations
        run: node scripts/check-migrations.mjs
      - run: npm run build

  coverage:
    # The Vitest suite AND the coverage ratchet on src/engine and
    # src/supabase/repositories (thresholds in vitest.config.ts).
    # `npm run coverage` is `vitest run --coverage` — the same tests the plain
    # `npm run test` runs, instrumented — so this single execution is both the
    # test gate and the ratchet. A required check in its own right, so it keeps
    # its own job: src/security/websiteWorkflowIsolation.test.ts pins the name,
    # and the branch ruleset requires that exact context.
    #
    # Measured before narrowing it: restricting this to the logic project would
    # finish in 16 seconds rather than two minutes, but it drops
    # src/supabase/repositories below its ratchet (lines 75.37 vs 76, functions
    # 76.15 vs 80) because jsdom component tests genuinely exercise those files.
    # Both projects stay. Lowering a threshold to buy runner minutes is exactly
    # what AGENTS.md forbids.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run coverage

  agent-tests:
    # Deno-runtime tests for the Edge Functions (their own runtime, not vitest):
    # the whatsapp-agent dispatch-contract tests, plus the pure staff-push
    # reconciliation tests in supabase/functions/_shared/staffPush.test.ts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned so the two Node scripts (check:edge-types, check:edge-auth) run
      # on the version the repository declares and tests against, not whatever
      # the runner image ships.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # check:edge-auth's verdict-flow pass parses each auth source with the
      # `typescript` package (a devDependency), so this job now installs
      # node_modules. The Deno steps are unaffected: both pass
      # --node-modules-dir=none and never resolve through the install.
      - run: npm ci
      # --node-modules-dir=none: Deno must not resolve through node_modules
      # (installed above for check:edge-auth) — without the flag the repo's
      # package.json makes Deno expect npm-style resolution. A single discovery root
      # auto-runs every *.test.ts under functions/ (whatsapp-agent/__tests__/ +
      # _shared/), so a newly-added Deno test can't be silently skipped by
      # forgetting to list it. Non-test files (e.g. webpush.proof.ts) don't
      # match Deno's test glob and are ignored.
      # The Edge Functions import @supabase/supabase-js live from esm.sh, so a
      # transient CDN hiccup (e.g. HTTP 522) makes the import — not a test —
      # fail and red-X main. Retry the whole run a few times: Deno caches
      # successful remote fetches within a run, so a genuine test failure still
      # fails on every attempt, but a one-off CDN blip clears on a retry.
      # Deno only type-checks modules reachable from the *.test.ts files it
      # discovers, and no test imports an index.ts — so without this step every
      # Edge Function entrypoint ships unchecked. PR #589 proved the cost: the
      # full lint/typecheck/test/build bar passed while two real type errors
      # sat in an entrypoint. Runs BEFORE the tests: a type error reads as a
      # type error rather than a downstream test failure, and the check warms
      # Deno's remote-module cache for the step below.
      #
      # Must be its own step — the test step's retry loop exits 0 inside its
      # own `for`, so anything appended there would never run.
      #
      # Same 3-attempt retry, for the same reason: the entrypoints import
      # @supabase/supabase-js from esm.sh, so `deno check` has the identical
      # transient-CDN exposure the test step documents below.
      - name: Type-check Edge Function entrypoints
        run: |
          for attempt in 1 2 3; do
            echo "::group::deno check (attempt $attempt/3)"
            if npm run check:edge-types; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "deno check attempt $attempt failed"
            [ "$attempt" -lt 3 ] && { echo "retrying in $((attempt * 10))s…"; sleep $((attempt * 10)); }
          done
          echo "::error::deno check failed after 3 attempts"
          exit 1

      # Every function is deployed with --no-verify-jwt, so its in-function check
      # IS the security boundary. This fails when a deployable function has no
      # entry in _shared/authManifest.json, when an entry disagrees with the
      # source it describes (origin allowlist, service-role use, config.toml
      # declaration), or when a required auth primitive's verdict no longer
      # reaches an exiting guard — a check whose result is discarded fails even
      # though the call is still present. Parses with the `typescript` package
      # from the npm ci above; the step itself makes no network calls and cannot
      # fail on a CDN blip, hence no retry loop.
      - name: Check Edge Function auth contract
        run: npm run check:edge-auth

      - name: Run Edge Function (Deno) tests
        run: |
          for attempt in 1 2 3; do
            echo "::group::deno test (attempt $attempt/3)"
            if deno test --node-modules-dir=none --allow-env supabase/functions/; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "deno test attempt $attempt failed"
            [ "$attempt" -lt 3 ] && { echo "retrying in $((attempt * 10))s…"; sleep $((attempt * 10)); }
          done
          echo "::error::deno test failed after 3 attempts"
          exit 1

  e2e:
    # Playwright is by far the heaviest CI consumer (npm ci + browser
    # download + the run), so the full browser pass only happens on push
    # to main and on manual dispatch. On pull requests this job reports
    # success without spinning up browsers: that keeps the `e2e` status
    # check green — so branch protection is never left hanging — while
    # saving the bulk of the Actions minutes that every PR push used to
    # burn. To run e2e against a branch on demand, use the "Run workflow"
    # button (workflow_dispatch) on the CI workflow.
    runs-on: ubuntu-latest
    steps:
      - name: Skip on pull requests
        if: github.event_name == 'pull_request'
        run: echo "Skipping Playwright e2e on pull requests to conserve Actions minutes — it runs on push to main and via workflow_dispatch."
      - uses: actions/checkout@v7
        if: github.event_name != 'pull_request'
      - uses: actions/setup-node@v7
        if: github.event_name != 'pull_request'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: github.event_name != 'pull_request'
      - name: Resolve the pinned Playwright version
        id: playwright
        if: github.event_name != 'pull_request'
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # Playwright's browser bundles are the slowest part of these jobs and they
      # only change when the pinned version does, so cache them on that version.
      #
      # The key names the BROWSER SET as well: this job and the one below share
      # ~/.cache/ms-playwright but install different browsers, and a shared key
      # would let the chromium-only cache satisfy a job that also needs WebKit.
      # `install-deps` still runs on a hit — the system libraries are apt
      # packages on the runner, not files in the cached directory.
      - uses: actions/cache@v6
        id: playwright-cache
        if: github.event_name != 'pull_request'
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-chromium-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browsers
        if: github.event_name != 'pull_request' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system dependencies (cached browsers)
        if: github.event_name != 'pull_request' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run e2e
        if: github.event_name != 'pull_request'
      - if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  pr-production-smoke:
    # This is intentionally separate from `e2e`: PRs run every spec once, on
    # desktop Chromium, plus the smoke and viewport-continuity journeys on
    # WebKit, plus the specs the pull request itself changes on tablet and
    # mobile Chromium — while the full desktop/tablet/mobile matrix remains
    # post-merge/manual to control cost.
    #
    # The job name is load-bearing (branch protection may require it by name),
    # so it keeps the historical `pr-production-smoke` name even though the
    # suite is no longer smoke-only. Project selection lives in
    # playwright.config.ts under PLAYWRIGHT_PR_SMOKE.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Test the reviewed PR head, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history, so the changed-spec step below can diff this head
          # against its merge base with the base branch. The pack is small
          # (about 11 MB), so this costs seconds; a shallow clone cannot tell
          # "changed by this pull request" from "changed on main since it
          # branched".
          fetch-depth: 0
      - name: Verify checked-out pull-request head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA" || {
            echo "::error::Checked out $actual_sha, expected PR head $EXPECTED_SHA"
            exit 1
          }
      # Feeds the narrow-viewport run at the end of this job. A spec is only
      # exercised on tablet and mobile after merge, so a spec written against
      # the desktop layout can pass its own pull request and then turn `e2e`
      # red on main for every merge that follows — #894 fixed one that had
      # done exactly that for seven merges. Running just the changed spec on
      # the two narrow projects closes that gap at the cost of one extra spec
      # run, not the whole matrix.
      #
      # The diff is against the MERGE BASE with the base branch, not its tip:
      # a two-commit diff would also list every spec main has changed since
      # this branch was cut, and run a fix the branch does not carry. Deleted
      # specs are dropped (`--diff-filter=d`). A change to the Playwright
      # config, or to anything under e2e/ that is not itself a spec (a shared
      # helper, say), can affect every spec, so it selects them all. Paths in
      # this repository carry no spaces, which the space-separated output
      # relies on.
      - name: Select the specs this pull request changes
        id: changed-specs
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          merge_base="$(git merge-base "origin/$BASE_REF" HEAD)"
          specs=""
          all=""
          while IFS= read -r file; do
            case "$file" in
              e2e/*.spec.ts) specs="$specs $file" ;;
              playwright.config.ts|e2e/*) all=1 ;;
            esac
          done < <(git diff --name-only --diff-filter=d "$merge_base" HEAD -- e2e playwright.config.ts)
          if [ -n "$all" ]; then
            selection="all"
          else
            selection="${specs# }"
          fi
          echo "specs=$selection" >> "$GITHUB_OUTPUT"
          if [ -z "$selection" ]; then
            echo "No spec, e2e helper or Playwright config changed; the narrow-viewport run is skipped."
          else
            echo "Narrow-viewport run will cover: $selection"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve the pinned Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # Playwright's browser bundles are the slowest part of these jobs and they
      # only change when the pinned version does, so cache them on that version.
      #
      # The key names the BROWSER SET as well: this job and the one below share
      # ~/.cache/ms-playwright but install different browsers, and a shared key
      # would let the chromium-only cache satisfy a job that also needs WebKit.
      # `install-deps` still runs on a hit — the system libraries are apt
      # packages on the runner, not files in the cached directory.
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-chromium-webkit-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browsers for PR smoke gate
        # WebKit is installed only here; the post-merge e2e job stays
        # Chromium-only, which is why the two cache keys differ.
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Install Playwright system dependencies (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
      - name: Assert the PR suite is non-empty
        env:
          PLAYWRIGHT_PR_SMOKE: "1"
        run: |
          npx playwright test --project=desktop --list | tee pr-smoke-test-list.txt
          test_count="$(sed -n 's/^Total: \([0-9][0-9]*\) tests\? in .*/\1/p' pr-smoke-test-list.txt)"
          test -n "$test_count" && test "$test_count" -gt 0 || {
            echo "::error::PR smoke suite is empty."
            exit 1
          }
          echo "PR smoke suite contains $test_count tests."
      # Two invocations, each naming its own specs, because this job checks out
      # the PR HEAD while the workflow itself comes from the merge commit. A
      # pull request branched before the gate widened still has the old
      # playwright.config.ts, so per-project spec selection must NOT be read
      # from the checked-out config — state it here, where the merged workflow
      # is authoritative, and the gate behaves the same at any branch age.
      #
      # Each invocation's report is asserted IN THE SAME STEP that wrote it,
      # via an ABSOLUTE PLAYWRIGHT_JSON_OUTPUT_NAME. Both halves are
      # load-bearing: a relative output name is not honoured as a path — the
      # json reporter drops the file as basename-into-outputDir, so the report
      # always sat inside test-results/ (Playwright's own folder) whatever the
      # env said, and the second invocation's startup emptied it there — which
      # is how the first two-invocation run went red on ENOENT with both
      # suites green. An absolute path escapes outputDir entirely, and
      # asserting in-step leaves no window for anything to intervene.
      - name: Run production-build PR suite — every spec on desktop Chromium
        env:
          PLAYWRIGHT_PR_SMOKE: "1"
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/pr-gate-results/pr-desktop-results.json
        run: |
          npx playwright test --project=desktop \
            --reporter=line,github,html,json
          node scripts/assert-playwright-pr-smoke-results.mjs \
            pr-gate-results/pr-desktop-results.json desktop
      # The WebKit spec list is named here, not read from the checked-out
      # config, for the reason given above. Keep it in step with the
      # mobile-webkit project's testMatch in playwright.config.ts, which is
      # what reproduces this run locally.
      - name: Run production-build PR suite — smoke and viewport journeys on WebKit
        env:
          PLAYWRIGHT_PR_SMOKE: "1"
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/pr-gate-results/pr-webkit-results.json
        run: |
          npx playwright test e2e/smoke.spec.ts e2e/viewport-continuity.spec.ts \
            --project=mobile-webkit \
            --reporter=line,github,html,json
          node scripts/assert-playwright-pr-smoke-results.mjs \
            pr-gate-results/pr-webkit-results.json mobile-webkit
      # Third invocation: the specs this pull request changes, on the same
      # tablet and mobile Chromium projects the post-merge `e2e` job runs. It
      # deliberately does NOT set PLAYWRIGHT_PR_SMOKE: the two projects are
      # read from the checked-out config's full matrix, which every live
      # branch has carried since that matrix was introduced, so the step works
      # at any branch age without adding projects to the PR-smoke config. The
      # selection itself comes from the merged workflow (the step above), for
      # the reason given at the desktop step. Locally:
      #   npx playwright test e2e/<spec> --project=tablet --project=mobile
      #
      # Skipped tests are allowed here and nowhere else: a spec may gate
      # itself on viewport (`test.skip(width < 1024, …)`), and on a phone that
      # is the spec working as written, not the gate going quiet. The "ran no
      # tests" check still applies to both projects. A branch cut before this
      # step existed carries the older assertion script, which does not read
      # PR_SMOKE_ALLOW_SKIPPED; if that fails on a skipped test, merge main.
      - name: Run production-build PR suite — changed specs on tablet and mobile Chromium
        if: steps.changed-specs.outputs.specs != ''
        env:
          SPECS: ${{ steps.changed-specs.outputs.specs }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/pr-gate-results/pr-narrow-results.json
          PR_SMOKE_ALLOW_SKIPPED: "1"
        run: |
          if [ "$SPECS" = all ]; then set --; else set -- $SPECS; fi
          npx playwright test "$@" --project=tablet --project=mobile \
            --reporter=line,github,html,json
          node scripts/assert-playwright-pr-smoke-results.mjs \
            pr-gate-results/pr-narrow-results.json tablet mobile
      - name: Retain Playwright failure context
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-production-smoke-${{ github.event.pull_request.head.sha }}
          path: |
            playwright-report/
            test-results/
            pr-gate-results/
            pr-smoke-test-list.txt
          if-no-files-found: warn
          retention-days: 7
