name: DB Tests (pgTAP)

# Runtime coverage for the parts Vitest cannot reach: booking write gates,
# RLS, SECURITY DEFINER RPCs, and transaction/concurrency behaviour.
#
# The job has no hosted Supabase credentials and never links, queries, or dumps
# production. It copies the committed Supabase project into the runner's
# temporary directory, injects only the legacy project-default grants and inert
# local Vault value required by historical migration replay, restores
# closed-by-default grants for future migrations, and builds the database from
# every committed migration. The source checkout and production history are
# unchanged.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/config.toml'
      - 'package.json'
      - 'scripts/prepare-db-test-project.mjs'
      - 'scripts/verify-db-concurrency.sh'
      - 'scripts/verify-capacity-concurrency.sh'
      - 'scripts/verify-whatsapp-reschedule-concurrency.sh'
      - 'scripts/postgres-concurrency-driver.sh'
      - '.github/workflows/db-tests.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/config.toml'
      - 'package.json'
      - 'scripts/prepare-db-test-project.mjs'
      - 'scripts/verify-db-concurrency.sh'
      - 'scripts/verify-capacity-concurrency.sh'
      - 'scripts/verify-whatsapp-reschedule-concurrency.sh'
      - 'scripts/postgres-concurrency-driver.sh'
      - '.github/workflows/db-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Prepare isolated local project
        run: node scripts/prepare-db-test-project.mjs "$RUNNER_TEMP/db-test-project"

      - name: Rebuild local database from committed migrations
        timeout-minutes: 10
        run: supabase --workdir "$RUNNER_TEMP/db-test-project" start

      - name: Run pgTAP database tests
        timeout-minutes: 5
        run: supabase --workdir "$RUNNER_TEMP/db-test-project" test db

      - name: Prove database concurrency
        timeout-minutes: 5
        env:
          CONCURRENCY_LOCAL_STACK_CONFIRMED: '1'
        run: npm run test:db:concurrency

      - name: Dump diagnostics on failure
        if: failure()
        run: supabase --workdir "$RUNNER_TEMP/db-test-project" status || true

      - name: Remove disposable database
        if: always()
        run: supabase --workdir "$RUNNER_TEMP/db-test-project" stop --no-backup || true
