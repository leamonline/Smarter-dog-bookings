name: DB Tests (pgTAP)

# Runtime coverage for the parts Vitest can't reach: the booking BEFORE INSERT
# gates, RLS, and the SECURITY DEFINER write-path RPCs.
#
# WHY A SCHEMA BASELINE (not migration replay): the committed migration history
# does NOT rebuild from scratch — it has drift (timestamps that map to different
# migrations than prod) and by-design prod-environment prerequisites (e.g. a
# migration that RAISES unless a Vault secret was provisioned out-of-band). So
# instead of replaying migrations, we dump prod's CURRENT application schemas:
# `public` plus the non-API `smarter_dog_private` receipt schema. The dump is
# schema-only — `supabase db dump` carries NO data and NO custom roles unless
# you pass --data-only/--role-only, and excludes the managed auth/storage
# schemas. We use it as the single baseline the local stack boots from. The
# tests then run against a faithful copy of the real schema. On pull requests,
# migrations added relative to the base branch are applied after that baseline
# so the candidate schema is tested without replaying the drifted history.
#
# `supabase start` supplies the base Supabase environment (the auth schema +
# auth.uid(), the anon/authenticated/service_role roles, extensions) that the
# dumped application objects reference. `supabase test db` runs
# supabase/tests/*.sql
# under pgTAP; each test is wrapped in a transaction that is rolled back.
#
# Requires the repo's SUPABASE_ACCESS_TOKEN secret (already set for edge
# deploys). The CLI uses that token to create a short-lived database login role,
# so CI never stores or transmits the production database password.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/config.toml'
      - 'scripts/verify-whatsapp-reschedule-concurrency.sh'
      - 'package.json'
      - '.github/workflows/db-tests.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/config.toml'
      - 'scripts/verify-whatsapp-reschedule-concurrency.sh'
      - 'package.json'
      - '.github/workflows/db-tests.yml'
  workflow_dispatch:

jobs:
  db-tests:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: nlzhllhkigmsvrzduefz
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          # PR runs need the base history to identify candidate migrations.
          fetch-depth: 0

      - name: Preserve PR-added candidate migrations
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"

          candidate_root="$(mktemp -d)"
          echo "CANDIDATE_MIGRATIONS_DIR=$candidate_root" >> "$GITHUB_ENV"

          git diff --name-only --diff-filter=A -z \
            "origin/${BASE_REF}...HEAD" -- supabase/migrations/ \
            > "$candidate_root/added-migrations"

          count=0
          while IFS= read -r -d '' migration; do
            case "$migration" in
              *.sql) ;;
              *) continue ;;
            esac
            destination="$candidate_root/$migration"
            mkdir -p "$(dirname "$destination")"
            cp -- "$migration" "$destination"
            count=$((count + 1))
          done < "$candidate_root/added-migrations"

          echo "Candidate migrations preserved: $count"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Dump prod application schemas (schema-only — no customer data) as the baseline
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          # Schema-only by default. The private schema contains durable receipt
          # structure but no rows are copied. Before its production migration
          # exists, pg_dump simply matches public and the PR candidate creates
          # smarter_dog_private in the disposable stack.
          supabase db dump --linked \
            --schema public,smarter_dog_private \
            -f /tmp/baseline.sql
          echo "baseline: $(wc -l < /tmp/baseline.sql) lines"
          # Replace the (non-rebuildable) migration history with the prod schema
          # as an ephemeral baseline, so `supabase start` boots a faithful
          # schema. Supabase's schema-dump guidance requires revoking the
          # target's default table grants before restore; otherwise locally
          # created tables acquire anon/authenticated ACLs absent from prod.
          # The dump can then restore every legitimate source grant explicitly.
          # The checkout is ephemeral — this does not touch the repo.
          rm -rf supabase/migrations
          mkdir -p supabase/migrations
          printf '%s\n' \
            'alter default privileges for role postgres in schema public revoke all on tables from anon, authenticated, service_role;' \
            > supabase/migrations/00000000000000_target_acl_baseline.sql
          cp /tmp/baseline.sql supabase/migrations/00000000000001_prod_baseline.sql

      - name: Restore PR-added candidate migrations
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          candidate_source="$CANDIDATE_MIGRATIONS_DIR/supabase/migrations"
          if [ -d "$candidate_source" ]; then
            # Original timestamped names keep candidates after the baseline.
            cp -R -- "$candidate_source/." supabase/migrations/
          fi

      - name: Start local stack (applies baseline then candidate migrations)
        run: supabase start

      - name: Run pgTAP database tests
        run: supabase test db

      - name: Prove atomic reschedule concurrency
        timeout-minutes: 5
        env:
          CONCURRENCY_LOCAL_STACK_CONFIRMED: '1'
        run: npm run test:db:concurrency

      - name: Dump diagnostics on failure
        if: failure()
        run: supabase status || true
