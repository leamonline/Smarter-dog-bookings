name: iPhone auth

# The sign-in decisions have no UIKit dependency, so Linux can run them.
# This does not compile the iPhone app. Xcode Cloud still does that.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-auth-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  auth-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GPG for Swiftly toolchain verification
        run: sudo apt-get update && sudo apt-get install -y gnupg
      # setup-swift v3 verifies the Swiftly archive before Swiftly imports keys.
      - name: Import Swift release signing keys
        run: |
          curl --fail --silent --show-error --location https://www.swift.org/keys/all-keys.asc --output "$RUNNER_TEMP/swift-signing-keys.asc"
          gpg --batch --import "$RUNNER_TEMP/swift-signing-keys.asc"
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.0.3"
          skip-verify-signature: false
      - name: Test sign-in decisions
        run: swift test --package-path ios
