name: Apply named migrations to production

# Production only, by hand, behind the `production` GitHub environment.
# Nothing here runs on push, pull request or schedule: an operator dispatches
# it with the exact production ref typed as confirmation, the environment's
# required reviewers approve the run, and only then does the job link
# production. It runs scripts/apply-hosted-migrations.sh, the same script the
# staging workflow uses, with that script's explicit production opt-in, so
# there is one apply path to review.
#
# The access token is read from PRODUCTION_SUPABASE_ACCESS_TOKEN, a secret that
# must exist ONLY on the `production` environment (never at repository level):
# GitHub creates a referenced environment with no protection rules if it does
# not exist yet, so an unconfigured environment would otherwise run with the
# repository-level token. Without that secret the first step fails closed.
#
# Dispatch it from `main`: the environment's deployment branch policy allows
# only `main`, so the workflow and the apply script always run as reviewed
# there. The migration FILES come from the commit named in `ref` (normally the
# reviewed pull request head, which may not be merged yet): only
# supabase/migrations/ is taken from it, so a branch can never carry a
# weakened workflow or script into production.
# Procedure, evidence and what to do after a partial failure:
# docs/migrations.md ("Applying migrations to production") and ADR 006.
on:
  workflow_dispatch:
    inputs:
      confirm_production_ref:
        description: Type the exact PRODUCTION project ref to continue
        required: true
        type: string
      ref:
        description: Full 40-character commit SHA whose supabase/migrations/ files to apply (the reviewed pull request head); the workflow and script run from main regardless
        required: true
        type: string
      migrations:
        description: Space-separated migration file names under supabase/migrations/ (applied in the order given)
        required: true
        type: string
      postcondition:
        description: One SELECT, no semicolons, that must return exactly one boolean true after the apply (ADR 006 behavioural postcondition; it runs read-only as `select (…) is true`), e.g. select exists (select 1 from information_schema.columns where table_schema = 'public' and table_name = 'humans' and column_name = 'x')
        required: true
        type: string
      reapply:
        description: Optional subset of those names to run again even though they are already in the production ledger (for out-of-order repairs)
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pull-requests: read # only to confirm `ref` is the current head of an open pull request

concurrency:
  group: production-apply-migrations
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    env:
      PRODUCTION_PROJECT_REF: nlzhllhkigmsvrzduefz
      STAGING_PROJECT_REF: btjnxvgkpdbfrrqxvkfj
    steps:
      - name: Confirm exact production target
        shell: bash
        env:
          # Inputs and context reach the shell through env, never by
          # interpolating ${{ }} into run:, matching the other workflows.
          CONFIRM_PRODUCTION_REF: ${{ inputs.confirm_production_ref }}
          MIGRATION_REF: ${{ inputs.ref }}
          MIGRATIONS: ${{ inputs.migrations }}
          REAPPLY_MIGRATIONS: ${{ inputs.reapply }}
          POSTCONDITION_SQL: ${{ inputs.postcondition }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCTION_SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM_PRODUCTION_REF" != "$PRODUCTION_PROJECT_REF" ]; then
            echo "::error::Confirmation does not match the production project ref."
            exit 1
          fi
          if [ "$STAGING_PROJECT_REF" = "$PRODUCTION_PROJECT_REF" ]; then
            echo "::error::Staging and production project refs must differ."
            exit 1
          fi
          if [ -z "${PRODUCTION_SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::The production environment is not configured: no PRODUCTION_SUPABASE_ACCESS_TOKEN environment secret reached this job. Create the production environment with required reviewers and that secret before dispatching (docs/migrations.md)."
            exit 1
          fi
          if [[ ! "$MIGRATION_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ref must be the full 40-character lower-case commit SHA whose migration files to apply."
            exit 1
          fi
          if [ -z "${POSTCONDITION_SQL// /}" ]; then
            echo "::error::postcondition is required: one read-only SELECT returning exactly one boolean true (ADR 006)."
            exit 1
          fi
          echo "Target: PRODUCTION ($PRODUCTION_PROJECT_REF); dispatched by $ACTOR (triggering actor $TRIGGERING_ACTOR), attempt $RUN_ATTEMPT"
          echo "Migration files from commit: $MIGRATION_REF"
          echo "Migrations requested: $MIGRATIONS"
          echo "Re-apply: ${REAPPLY_MIGRATIONS:-none}"
          echo "Postcondition: $POSTCONDITION_SQL"
          {
            echo "## Production migration run"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Target | **production** (\`$PRODUCTION_PROJECT_REF\`) |"
            echo "| Dispatched by | \`$ACTOR\` (triggering actor \`$TRIGGERING_ACTOR\`), attempt $RUN_ATTEMPT |"
            echo "| Migration files from commit | \`$MIGRATION_REF\` |"
            echo "| Migrations requested | \`$MIGRATIONS\` |"
            echo "| Re-apply | \`${REAPPLY_MIGRATIONS:-none}\` |"
            echo "| Postcondition | \`$POSTCONDITION_SQL\` |"
            echo "| Exact-ref confirmation | passed |"
            echo "| Production environment secret present | yes |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Take supabase/migrations from the reviewed commit
        id: overlay
        shell: bash
        env:
          MIGRATION_REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The named commit must be current: either already on main, or the
          # present head of an open pull request into main. A superseded head
          # could carry older SQL under a filename the pull request still has.
          compare="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$MIGRATION_REF" --jq '.status')"
          if [ "$compare" = "identical" ] || [ "$compare" = "behind" ]; then
            provenance="already on main ($compare)"
          else
            open_heads="$(gh api "repos/$GITHUB_REPOSITORY/commits/$MIGRATION_REF/pulls" |
              jq --arg sha "$MIGRATION_REF" '[.[] | select(.state == "open" and .base.ref == "main" and .head.sha == $sha) | .number] | length')"
            if [ "$open_heads" = "0" ]; then
              echo "::error::Commit $MIGRATION_REF is neither on main nor the current head of an open pull request into main (compare status: $compare). Dispatch with the pull request's present head."
              exit 1
            fi
            provenance="current head of an open pull request into main"
          fi
          echo "Commit provenance: $provenance"
          # The checkout above is main (the dispatched ref): the workflow and
          # scripts/apply-hosted-migrations.sh stay as reviewed there. Only the
          # migration directory is taken from the named commit, and it is
          # emptied first so a file that exists on main but not in that commit
          # cannot survive the overlay and be applied under its name.
          git fetch --no-tags --depth=1 origin "$MIGRATION_REF"
          rm -rf supabase/migrations
          git checkout "$MIGRATION_REF" -- supabase/migrations/
          echo "Migration files taken from commit $MIGRATION_REF: $(git log -1 --format='%s' "$MIGRATION_REF")"
          echo "| Migration files overlaid from | \`$MIGRATION_REF\` ($(git log -1 --format='%s' "$MIGRATION_REF" | sed 's/|/ /g')); $provenance |" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate the requested names and show the exact SQL
        id: preflight
        shell: bash
        env:
          MIGRATION_REF: ${{ inputs.ref }}
          MIGRATIONS: ${{ inputs.migrations }}
          REAPPLY_MIGRATIONS: ${{ inputs.reapply }}
        run: |
          set -euo pipefail
          # The same rules the script enforces, applied before production is
          # linked: only committed basenames, never paths or free SQL; every
          # file must exist in the named commit itself; and a re-apply name
          # must also be in the list to apply, or it would never run.
          # shellcheck disable=SC2086
          for migration in $MIGRATIONS $REAPPLY_MIGRATIONS; do
            if [[ ! "$migration" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "::error::Refusing '$migration': expected <14-digit version>_<snake_case_name>.sql"
              exit 1
            fi
            # A regular file in the named commit (mode 100644/100755), never a
            # symbolic link that could point outside the directory, and the
            # overlaid working-tree file must be byte-identical to that blob.
            mode="$(git ls-tree "$MIGRATION_REF" -- "supabase/migrations/$migration" | awk '{print $1}')"
            if [ "$mode" != "100644" ] && [ "$mode" != "100755" ]; then
              echo "::error::supabase/migrations/$migration is not a regular file in commit $MIGRATION_REF (tree mode: ${mode:-absent})."
              exit 1
            fi
            if [ -L "supabase/migrations/$migration" ] || [ ! -f "supabase/migrations/$migration" ]; then
              echo "::error::supabase/migrations/$migration was not overlaid as a regular file from commit $MIGRATION_REF."
              exit 1
            fi
            if ! git show "$MIGRATION_REF:supabase/migrations/$migration" | cmp -s - "supabase/migrations/$migration"; then
              echo "::error::supabase/migrations/$migration differs from the blob in commit $MIGRATION_REF."
              exit 1
            fi
          done
          # shellcheck disable=SC2086
          if [ "$(printf '%s\n' $MIGRATIONS | sort | uniq -d | wc -l | tr -d ' ')" != "0" ]; then
            echo "::error::migrations names the same file more than once; a duplicate would run twice under reapply."
            exit 1
          fi
          # shellcheck disable=SC2086
          for candidate in $REAPPLY_MIGRATIONS; do
            listed=0
            for migration in $MIGRATIONS; do
              [ "$migration" = "$candidate" ] && listed=1
            done
            if [ "$listed" != 1 ]; then
              echo "::error::reapply entry '$candidate' is not in migrations, so it would never run."
              exit 1
            fi
          done
          # shellcheck disable=SC2086
          for migration in $MIGRATIONS; do
            echo "::group::supabase/migrations/$migration (sha256 $(sha256sum "supabase/migrations/$migration" | cut -c1-16)…, $(wc -l < "supabase/migrations/$migration" | tr -d ' ') lines)"
            cat "supabase/migrations/$migration"
            echo "::endgroup::"
          done
          echo "| Names validated and SQL shown | passed |" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Link production and record its migration state before applying
        id: link
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          # Every linked command from here targets production.
          supabase link --project-ref "$PRODUCTION_PROJECT_REF"
          test "$(cat supabase/.temp/project-ref)" = "$PRODUCTION_PROJECT_REF"
          supabase migration list --linked
          echo "| Linked project ref verified | \`$(cat supabase/.temp/project-ref)\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply the named migrations to production
        id: apply
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
          HOSTED_MIGRATION_TARGET: production
          CONFIRM_PRODUCTION_REF: ${{ inputs.confirm_production_ref }}
          MIGRATIONS: ${{ inputs.migrations }}
          REAPPLY_MIGRATIONS: ${{ inputs.reapply }}
          POSTCONDITION_SQL: ${{ inputs.postcondition }}
        run: |
          set -euo pipefail
          test "$(cat supabase/.temp/project-ref)" = "$PRODUCTION_PROJECT_REF"
          # Word-splitting the input is intentional; the script validates each name.
          # shellcheck disable=SC2086
          scripts/apply-hosted-migrations.sh "$PRODUCTION_PROJECT_REF" $MIGRATIONS 2>&1 | tee apply.log

      - name: Record production migration state after applying
        id: after
        if: ${{ !cancelled() && steps.link.outcome == 'success' }}
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test "$(cat supabase/.temp/project-ref)" = "$PRODUCTION_PROJECT_REF"
          supabase migration list --linked

      - name: Summarise the outcome
        if: ${{ always() }}
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          OVERLAY_OUTCOME: ${{ steps.overlay.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          LINK_OUTCOME: ${{ steps.link.outcome }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          AFTER_OUTCOME: ${{ steps.after.outcome }}
        run: |
          set -euo pipefail
          {
            echo
            echo "### Outcome"
            echo
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| Migration files taken from the named commit | $OVERLAY_OUTCOME |"
            echo "| Preflight: names validated, SQL shown | $PREFLIGHT_OUTCOME |"
            echo "| Production link verified, before-state listed | $LINK_OUTCOME |"
            echo "| Apply (one transaction per file with its ledger row, then ledger verification and the postcondition) | $APPLY_OUTCOME |"
            echo "| After-state listed | $AFTER_OUTCOME |"
            echo "| Job | **$JOB_STATUS** |"
            if [ -f apply.log ]; then
              echo
              echo "### Per-migration result"
              echo
              echo '```text'
              grep -E '^(file|strip|apply|reapply|skip|done|recorded|MISSING|MISMATCH|CONFLICT|REFUSED|postcondition|POSTCONDITION) ' apply.log || echo "(the script produced no per-migration lines; read the job log)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
