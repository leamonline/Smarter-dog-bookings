name: Apply named migrations to production

# Production only, by hand, behind the `production` GitHub environment.
# Nothing here runs on push, pull request or schedule: an operator dispatches
# it with the exact production ref typed as confirmation, the environment's
# required reviewers approve the run, and only then does the job link
# production. It runs scripts/apply-hosted-migrations.sh, the same script the
# staging workflow uses, with that script's explicit production opt-in, so
# there is one apply path to review.
#
# The access token is read from PRODUCTION_SUPABASE_ACCESS_TOKEN, a secret that
# must exist ONLY on the `production` environment (never at repository level):
# GitHub creates a referenced environment with no protection rules if it does
# not exist yet, so an unconfigured environment would otherwise run with the
# repository-level token. Without that secret the first step fails closed.
#
# Dispatch it from `main`: the environment's deployment branch policy allows
# only `main`, so the workflow and the apply script always run as reviewed
# there. The migration FILES come from the commit named in `ref` (normally the
# reviewed pull request head, which may not be merged yet): only
# supabase/migrations/ is taken from it, so a branch can never carry a
# weakened workflow or script into production.
# Procedure, evidence and what to do after a partial failure:
# docs/migrations.md ("Applying migrations to production") and ADR 006.
on:
  workflow_dispatch:
    inputs:
      confirm_production_ref:
        description: Type the exact PRODUCTION project ref to continue
        required: true
        type: string
      ref:
        description: Full 40-character commit SHA whose supabase/migrations/ files to apply (the reviewed pull request head); the workflow and script run from main regardless
        required: true
        type: string
      migrations:
        description: Space-separated migration file names under supabase/migrations/ (applied in the order given)
        required: true
        type: string
      postcondition:
        description: One SELECT, no semicolons, that must return exactly one boolean true after the apply (ADR 006 behavioural postcondition; it runs read-only as the anon role, as `select (…) is true`), written against pg_catalog, never information_schema (which hides what anon cannot select), e.g. select exists (select 1 from pg_catalog.pg_attribute a join pg_catalog.pg_class c on c.oid = a.attrelid join pg_catalog.pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relname = 'humans' and a.attname = 'x' and not a.attisdropped)
        required: true
        type: string
      reapply:
        description: Optional subset of those names to run again even though they are already in the production ledger (for out-of-order repairs)
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pull-requests: read # only to confirm `ref` is the current head of an open pull request
  actions: read # only to confirm the production environment really gates this job

concurrency:
  group: production-apply-migrations
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    env:
      PRODUCTION_PROJECT_REF: nlzhllhkigmsvrzduefz
      STAGING_PROJECT_REF: btjnxvgkpdbfrrqxvkfj
    steps:
      - name: Confirm exact production target
        shell: bash
        env:
          # Inputs and context reach the shell through env, never by
          # interpolating ${{ }} into run:, matching the other workflows.
          CONFIRM_PRODUCTION_REF: ${{ inputs.confirm_production_ref }}
          MIGRATION_REF: ${{ inputs.ref }}
          MIGRATIONS: ${{ inputs.migrations }}
          REAPPLY_MIGRATIONS: ${{ inputs.reapply }}
          POSTCONDITION_SQL: ${{ inputs.postcondition }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCTION_SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM_PRODUCTION_REF" != "$PRODUCTION_PROJECT_REF" ]; then
            echo "::error::Confirmation does not match the production project ref."
            exit 1
          fi
          if [ "$STAGING_PROJECT_REF" = "$PRODUCTION_PROJECT_REF" ]; then
            echo "::error::Staging and production project refs must differ."
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::This workflow runs only when dispatched from main (dispatched from $GITHUB_REF)."
            exit 1
          fi
          # Running under the production environment only means a reviewer
          # approved this run if that environment exists with a required-reviewers
          # rule: a referenced environment that does not exist is created with no
          # rules, and a secret of the same name at repository or organisation
          # level would still reach this job. So the environment itself is
          # checked, not the presence of a specially named secret.
          if ! environment="$(gh api "repos/$GITHUB_REPOSITORY/environments/production")"; then
            echo "::error::Could not read the production environment (it must exist, and the workflow needs actions: read); refusing to continue."
            exit 1
          fi
          reviewers="$(printf '%s' "$environment" | jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers | length] | add // 0')"
          if [ "$reviewers" -lt 1 ]; then
            echo "::error::The production environment has no required reviewers, so no approval gated this run. Configure it before dispatching (docs/migrations.md)."
            exit 1
          fi
          if [ "$(printf '%s' "$environment" | jq '.deployment_branch_policy == null')" = "true" ]; then
            echo "::error::The production environment has no deployment branch policy; restrict it to main before dispatching (docs/migrations.md)."
            exit 1
          fi
          if [ -z "${PRODUCTION_SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::No PRODUCTION_SUPABASE_ACCESS_TOKEN reached this job. Add it as a secret of the production environment before dispatching (docs/migrations.md)."
            exit 1
          fi
          if [[ ! "$MIGRATION_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ref must be the full 40-character lower-case commit SHA whose migration files to apply."
            exit 1
          fi
          if [ -z "${POSTCONDITION_SQL// /}" ]; then
            echo "::error::postcondition is required: one read-only SELECT returning exactly one boolean true (ADR 006)."
            exit 1
          fi
          echo "Target: PRODUCTION ($PRODUCTION_PROJECT_REF); dispatched by $ACTOR (triggering actor $TRIGGERING_ACTOR), attempt $RUN_ATTEMPT"
          echo "Migration files from commit: $MIGRATION_REF"
          echo "Migrations requested: $MIGRATIONS"
          echo "Re-apply: ${REAPPLY_MIGRATIONS:-none}"
          echo "Postcondition: $POSTCONDITION_SQL"
          {
            echo "## Production migration run"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Target | **production** (\`$PRODUCTION_PROJECT_REF\`) |"
            echo "| Dispatched by | \`$ACTOR\` (triggering actor \`$TRIGGERING_ACTOR\`), attempt $RUN_ATTEMPT |"
            echo "| Migration files from commit | \`$MIGRATION_REF\` |"
            echo "| Migrations requested | \`$MIGRATIONS\` |"
            echo "| Re-apply | \`${REAPPLY_MIGRATIONS:-none}\` |"
            echo "| Postcondition | \`$POSTCONDITION_SQL\` |"
            echo "| Exact-ref confirmation | passed |"
            echo "| Dispatched from | \`$GITHUB_REF\` |"
            echo "| Production environment | exists; required reviewers: $reviewers; deployment branch policy: set |"
            echo "| Production environment secret present | yes |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Take supabase/migrations from the reviewed commit
        id: overlay
        shell: bash
        env:
          MIGRATION_REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One current main, resolved now, after the environment approval and
          # any concurrency wait, during which main may have moved on from the
          # dispatched checkout. The provenance check here and the append-only
          # check in the next step both use this one SHA, and it is recorded.
          git fetch --no-tags --depth=1 origin main
          main_sha="$(git rev-parse FETCH_HEAD)"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            # The workflow and the apply code run as dispatched. If main has
            # since changed them, what would run is not what main now has.
            if ! git diff --quiet "$GITHUB_SHA" "$main_sha" -- .github/workflows/production-apply-migrations.yml scripts/apply-hosted-migrations.sh scripts/lex-migration-sql.pl scripts/production-ref-provenance.sh; then
              echo "::error::main has changed the production apply workflow or scripts since this run was dispatched ($GITHUB_SHA; main is now $main_sha). Dispatch again from current main."
              exit 1
            fi
            echo "::notice::main has moved on since this run was dispatched ($GITHUB_SHA; now $main_sha); the apply code is unchanged, and the migration checks use current main."
          fi
          # The named commit must qualify now, per scripts/production-ref-provenance.sh:
          # on main, or the current head of an open, non-draft pull request into
          # main with no reviewer's latest review requesting changes. A superseded
          # head could carry older SQL under a filename the pull request still has.
          # The same script runs again immediately before the production write.
          scripts/production-ref-provenance.sh "$main_sha" "$MIGRATION_REF" | tee provenance.out
          provenance="$(sed -n 's/^provenance=//p' provenance.out)"
          pr_number="$(sed -n 's/^pr_number=//p' provenance.out)"
          echo "Commit provenance: $provenance"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          # The checkout above is main (the dispatched ref): the workflow and
          # scripts/apply-hosted-migrations.sh stay as reviewed there. Only the
          # migration directory is taken from the named commit, and it is
          # emptied first so a file that exists on main but not in that commit
          # cannot survive the overlay and be applied under its name.
          git fetch --no-tags --depth=1 origin "$MIGRATION_REF"
          rm -rf supabase/migrations
          git checkout "$MIGRATION_REF" -- supabase/migrations/
          echo "Migration files taken from commit $MIGRATION_REF: $(git log -1 --format='%s' "$MIGRATION_REF")"
          echo "| Current main at run time | \`$main_sha\` (dispatched from \`$GITHUB_SHA\`) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Migration files overlaid from | \`$MIGRATION_REF\` ($(git log -1 --format='%s' "$MIGRATION_REF" | sed 's/|/ /g')); $provenance |" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate the requested names and show the exact SQL
        id: preflight
        shell: bash
        env:
          MIGRATION_REF: ${{ inputs.ref }}
          MIGRATIONS: ${{ inputs.migrations }}
          REAPPLY_MIGRATIONS: ${{ inputs.reapply }}
          MAIN_SHA: ${{ steps.overlay.outputs.main_sha }}
          PR_NUMBER: ${{ steps.overlay.outputs.pr_number }}
        run: |
          set -euo pipefail
          if [[ ! "$MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The current main SHA from the overlay step is missing; refusing to check history against a stale checkout."
            exit 1
          fi
          # The same rules the script enforces, applied before production is
          # linked: only committed basenames, never paths or free SQL; every
          # file must exist in the named commit itself; and a re-apply name
          # must also be in the list to apply, or it would never run.
          # shellcheck disable=SC2086
          for migration in $MIGRATIONS $REAPPLY_MIGRATIONS; do
            if [[ ! "$migration" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "::error::Refusing '$migration': expected <14-digit version>_<snake_case_name>.sql"
              exit 1
            fi
            # A regular file in the named commit (mode 100644/100755), never a
            # symbolic link that could point outside the directory, and the
            # overlaid working-tree file must be byte-identical to that blob.
            mode="$(git ls-tree "$MIGRATION_REF" -- "supabase/migrations/$migration" | awk '{print $1}')"
            if [ "$mode" != "100644" ] && [ "$mode" != "100755" ]; then
              echo "::error::supabase/migrations/$migration is not a regular file in commit $MIGRATION_REF (tree mode: ${mode:-absent})."
              exit 1
            fi
            if [ -L "supabase/migrations/$migration" ] || [ ! -f "supabase/migrations/$migration" ]; then
              echo "::error::supabase/migrations/$migration was not overlaid as a regular file from commit $MIGRATION_REF."
              exit 1
            fi
            if ! git show "$MIGRATION_REF:supabase/migrations/$migration" | cmp -s - "supabase/migrations/$migration"; then
              echo "::error::supabase/migrations/$migration differs from the blob in commit $MIGRATION_REF."
              exit 1
            fi
            # Applied history is append-only: a file that already exists on
            # current main (the SHA the overlay step resolved after the
            # approval wait, never the dispatch-time checkout) must be
            # byte-identical to that copy, or the fix belongs in a new, later
            # migration.
            if git cat-file -e "$MAIN_SHA:supabase/migrations/$migration" 2>/dev/null &&
               ! git show "$MAIN_SHA:supabase/migrations/$migration" | cmp -s - "supabase/migrations/$migration"; then
              echo "::error::supabase/migrations/$migration already exists on main ($MAIN_SHA) with different content; history is append-only, so add a new corrective migration instead."
              exit 1
            fi
            # A commit already on main may only supply files current main still
            # carries: a file main has since removed or renamed is history main
            # deliberately left behind, however reviewed it once was. Only a
            # current pull request head may introduce a path main does not have.
            if [ -z "$PR_NUMBER" ] && ! git cat-file -e "$MAIN_SHA:supabase/migrations/$migration" 2>/dev/null; then
              echo "::error::supabase/migrations/$migration is not on current main ($MAIN_SHA); a commit on main may only apply files main still carries."
              exit 1
            fi
          done
          # shellcheck disable=SC2086
          if [ "$(printf '%s\n' $MIGRATIONS | sort | uniq -d | wc -l | tr -d ' ')" != "0" ]; then
            echo "::error::migrations names the same file more than once; a duplicate would run twice under reapply."
            exit 1
          fi
          # shellcheck disable=SC2086
          for candidate in $REAPPLY_MIGRATIONS; do
            listed=0
            for migration in $MIGRATIONS; do
              [ "$migration" = "$candidate" ] && listed=1
            done
            if [ "$listed" != 1 ]; then
              echo "::error::reapply entry '$candidate' is not in migrations, so it would never run."
              exit 1
            fi
          done
          # shellcheck disable=SC2086
          for migration in $MIGRATIONS; do
            echo "::group::supabase/migrations/$migration (sha256 $(sha256sum "supabase/migrations/$migration" | cut -c1-16)…, $(wc -l < "supabase/migrations/$migration" | tr -d ' ') lines)"
            cat "supabase/migrations/$migration"
            echo "::endgroup::"
          done
          echo "| Names validated and SQL shown | passed |" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Link production and record its migration state before applying
        id: link
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          # Every linked command from here targets production.
          supabase link --project-ref "$PRODUCTION_PROJECT_REF"
          test "$(cat supabase/.temp/project-ref)" = "$PRODUCTION_PROJECT_REF"
          supabase migration list --linked
          echo "| Linked project ref verified | \`$(cat supabase/.temp/project-ref)\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply the named migrations to production
        id: apply
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
          HOSTED_MIGRATION_TARGET: production
          CONFIRM_PRODUCTION_REF: ${{ inputs.confirm_production_ref }}
          MIGRATIONS: ${{ inputs.migrations }}
          REAPPLY_MIGRATIONS: ${{ inputs.reapply }}
          POSTCONDITION_SQL: ${{ inputs.postcondition }}
          MIGRATION_REF: ${{ inputs.ref }}
          MAIN_SHA: ${{ steps.overlay.outputs.main_sha }}
          PR_NUMBER: ${{ steps.overlay.outputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Last look before the write: the commit must qualify now exactly as
          # it did in the overlay step (same script, same main SHA, same pull
          # request), so a pull request that moved on, closed, went back to
          # draft or received a changes-requested review since is refused with
          # nothing applied. A push after this point cannot merge different SQL
          # under the same name either, because the migrations-applied check
          # compares each file with the SQL this run records and looks for the
          # provenance line below, so the window is closed from both sides.
          scripts/production-ref-provenance.sh "$MAIN_SHA" "$MIGRATION_REF" | tee provenance-now.out
          if [ "$(sed -n 's/^pr_number=//p' provenance-now.out)" != "$PR_NUMBER" ]; then
            echo "::error::The commit's provenance changed since the overlay step (pull request #${PR_NUMBER:-none} then, #$(sed -n 's/^pr_number=//p' provenance-now.out) now); nothing was applied. Dispatch again."
            exit 1
          fi
          # Recorded in each ledger row ahead of the SQL, so the
          # migrations-applied check can find what this pull request applied
          # even if a later push drops the file.
          if [ -n "$PR_NUMBER" ]; then
            LEDGER_PROVENANCE="-- applied to production from pull request #$PR_NUMBER head $MIGRATION_REF by $GITHUB_ACTOR, run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          else
            LEDGER_PROVENANCE="-- applied to production from main $MIGRATION_REF by $GITHUB_ACTOR, run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          export LEDGER_PROVENANCE
          test "$(cat supabase/.temp/project-ref)" = "$PRODUCTION_PROJECT_REF"
          # Word-splitting the input is intentional; the script validates each name.
          # shellcheck disable=SC2086
          scripts/apply-hosted-migrations.sh "$PRODUCTION_PROJECT_REF" $MIGRATIONS 2>&1 | tee apply.log

      - name: Record production migration state after applying
        id: after
        if: ${{ !cancelled() && steps.link.outcome == 'success' }}
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test "$(cat supabase/.temp/project-ref)" = "$PRODUCTION_PROJECT_REF"
          supabase migration list --linked

      - name: Summarise the outcome
        if: ${{ always() }}
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          OVERLAY_OUTCOME: ${{ steps.overlay.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          LINK_OUTCOME: ${{ steps.link.outcome }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          AFTER_OUTCOME: ${{ steps.after.outcome }}
        run: |
          set -euo pipefail
          {
            echo
            echo "### Outcome"
            echo
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| Migration files taken from the named commit | $OVERLAY_OUTCOME |"
            echo "| Preflight: names validated, SQL shown | $PREFLIGHT_OUTCOME |"
            echo "| Production link verified, before-state listed | $LINK_OUTCOME |"
            echo "| Apply (one transaction per file with its ledger row, then ledger verification and the postcondition) | $APPLY_OUTCOME |"
            echo "| After-state listed | $AFTER_OUTCOME |"
            echo "| Job | **$JOB_STATUS** |"
            if [ -f apply.log ]; then
              echo
              echo "### Per-migration result"
              echo
              echo '```text'
              grep -E '^(file|strip|apply|reapply|skip|done|recorded|MISSING|MISMATCH|CONFLICT|REFUSED|postcondition|POSTCONDITION) ' apply.log || echo "(the script produced no per-migration lines; read the job log)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
