name: Verify Supabase credential isolation

# Run only after trusted installation. Reads a constant; applies no migration.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: supabase-credential-isolation
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'leamonline/Smarter-dog-bookings' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: supabase-automation
            secret: SUPABASE_AUTOMATION_TOKEN
            allowed: nlzhllhkigmsvrzduefz
            forbidden: btjnxvgkpdbfrrqxvkfj
          - environment: staging
            secret: STAGING_SUPABASE_ACCESS_TOKEN
            allowed: btjnxvgkpdbfrrqxvkfj
            forbidden: nlzhllhkigmsvrzduefz
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify production environment protection
        if: matrix.environment == 'supabase-automation'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/automation-environment.mjs
      - name: Verify allowed and forbidden project access without data changes
        shell: bash
        env:
          TOKEN: ${{ secrets[matrix.secret] }}
          ALLOWED_PROJECT: ${{ matrix.allowed }}
          FORBIDDEN_PROJECT: ${{ matrix.forbidden }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::The environment credential is missing."
            exit 1
          fi
          result=$(mktemp)
          trap 'rm -f "$result"' EXIT
          probe() {
            curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output "$result" --write-out '%{http_code}' \
              --request POST "https://api.supabase.com/v1/projects/$1/database/query" \
              --header "Authorization: Bearer $TOKEN" \
              --header 'Content-Type: application/json' \
              --data '{"query":"select 1 as credential_probe"}'
          }
          status=$(probe "$ALLOWED_PROJECT")
          if [[ "$status" != 200 && "$status" != 201 ]] || ! jq -e '. == [{"credential_probe":1}]' "$result" > /dev/null; then
            echo "::error::The credential could not read the constant from its intended project (HTTP $status)."
            exit 1
          fi
          status=$(probe "$FORBIDDEN_PROJECT")
          if [ "$status" != 403 ]; then
            echo "::error::Project isolation is unproved: the other project returned HTTP $status instead of 403."
            exit 1
          fi
          echo "Verified: intended project permits the constant query; the other project denies it."
