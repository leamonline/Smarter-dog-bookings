    <!-- Top cap highlight -->
    <ellipse cx="578.4000000000001" cy="148" rx="17" ry="6" fill="#7A7A7A"/>
    <ellipse cx="576.4000000000001" cy="144" rx="9" ry="3" fill="#B8B8B8"/>
    <!-- Left-edge subtle shadow on the post -->
    <rect x="558.4000000000001" y="152" width="3" height="129.6"
