    <!-- Top cap highlight -->
    <ellipse cx="719.2" cy="148" rx="17" ry="6" fill="#7A7A7A"/>
    <ellipse cx="717.2" cy="144" rx="9" ry="3" fill="#B8B8B8"/>
    <!-- Left-edge subtle shadow on the post -->
    <rect x="699.2" y="152" width="3" height="129.6"
