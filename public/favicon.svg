    <!-- Bright top sliver -->
    <ellipse cx="431.6" cy="140" rx="6" ry="3" fill="#B5B5B5" opacity="0.9"/>
    <!-- Dark base shadow where ring enters page -->
    <ellipse cx="439.6" cy="290" rx="28" ry="5" fill="#000" opacity="0.7"/>
  </g>
  <g>
    <!-- Drop shadow on the paper below the ring -->
    <ellipse cx="588.4000000000001" cy="304" rx="36" ry="10" fill="#0A1C70" opacity="0.35"/>

    <!-- Punched eyelet hole through the yellow header band -->
    <ellipse cx="584.4000000000001" cy="348" rx="20" ry="14" fill="#8A5E03"/>
    <ellipse cx="584.4000000000001" cy="346" rx="16" ry="10" fill="#3A2602"/>

    <!-- The metal ring loop body. A tall vertical pill, rounded at top and bottom. -->
    <rect x="552.4000000000001" y="130" width="64" height="162" rx="32" ry="32"
