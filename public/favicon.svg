    <!-- Inner shading to suggest the hollow loop / 3D form (darker centre) -->
    <rect x="713.2" y="146" width="32" height="112"
          rx="16" fill="#000" opacity="0.7"/>

    <!-- Right-edge specular highlight -->
    <rect x="749.2" y="148" width="6" height="97.2"
          rx="3" fill="#5A5A5A"/>
    <!-- Top cap highlight -->
    <ellipse cx="723.2" cy="144" rx="14" ry="7" fill="#7A7A7A" opacity="0.95"/>
    <!-- Bright top sliver -->
    <ellipse cx="721.2" cy="140" rx="6" ry="3" fill="#B5B5B5" opacity="0.9"/>
    <!-- Dark base shadow where ring enters page -->
