<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF1F6"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFCE36"/>
      <stop offset="1" stop-color="#D69A0C"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A52F0"/>
      <stop offset="1" stop-color="#1430B0"/>
    </linearGradient>
    <radialGradient id="pawInset" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#A9AEBC"/>
      <stop offset="0.6" stop-color="#C5C9D2"/>
      <stop offset="1" stop-color="#E6E8EE"/>
    </radialGradient>
    <clipPath id="paperClip">
      <rect x="160" y="240" width="704" height="660" rx="44" ry="44"/>
    </clipPath>
  </defs>

  <!-- Deep-blue rounded-square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="180" ry="180" fill="url(#blueGrad)"/>

  <!-- Paper drop shadow -->
  <rect x="154" y="258" width="716" height="660" rx="44" ry="44"
        fill="#0A1C70" opacity="0.55"/>

  <g clip-path="url(#paperClip)">
    <!-- White paper body -->
    <rect x="160" y="240" width="704" height="660" fill="url(#paperGrad)"/>

    <!-- Yellow top band -->
    <rect x="160" y="240" width="704" height="170" fill="url(#yellowGrad)"/>
    <!-- Shadow seam below the yellow band -->
    <rect x="160" y="410" width="704" height="8" fill="#D69A0C" opacity="0.35"/>
    <rect x="160" y="418" width="704" height="14" fill="#000" opacity="0.06"/>

    <!-- Debossed paw print: dark "depth" shape, then paper-colored hollow that sits inside it, then highlight rim -->
    
  <g transform="translate(516 689) scale(1)" fill="#9097A8" opacity="0.55">
    <ellipse cx="0" cy="78" rx="118" ry="92"/>
    <ellipse cx="-122" cy="-24" rx="44" ry="58" transform="rotate(-22 -122 -24)"/>
    <ellipse cx="-42"  cy="-94" rx="40" ry="56"/>
    <ellipse cx="42"   cy="-94" rx="40" ry="56"/>
    <ellipse cx="122"  cy="-24" rx="44" ry="58" transform="rotate(22 122 -24)"/>
  </g>
    
  <g transform="translate(512 683) scale(0.96)" fill="url(#pawInset)" opacity="1">
    <ellipse cx="0" cy="78" rx="118" ry="92"/>
    <ellipse cx="-122" cy="-24" rx="44" ry="58" transform="rotate(-22 -122 -24)"/>
    <ellipse cx="-42"  cy="-94" rx="40" ry="56"/>
    <ellipse cx="42"   cy="-94" rx="40" ry="56"/>
    <ellipse cx="122"  cy="-24" rx="44" ry="58" transform="rotate(22 122 -24)"/>
  </g>
    
  <g transform="translate(509 678) scale(0.92)" fill="#F5F6FA" opacity="0.9">
    <ellipse cx="0" cy="78" rx="118" ry="92"/>
    <ellipse cx="-122" cy="-24" rx="44" ry="58" transform="rotate(-22 -122 -24)"/>
    <ellipse cx="-42"  cy="-94" rx="40" ry="56"/>
    <ellipse cx="42"   cy="-94" rx="40" ry="56"/>
    <ellipse cx="122"  cy="-24" rx="44" ry="58" transform="rotate(22 122 -24)"/>
  </g>

    <!-- Page curl: the underside of the curling paper at the bottom-right corner -->
    <!-- Shadow under the curl -->
    <path d="
      M 699 900
      Q 794 870
        864 735
      L 864 900
      Z"
      fill="#9097A8" opacity="0.55"/>
    <!-- The curled paper itself -->
    <path d="
      M 714 900
      Q 814 840
        864 750
      Q 824 800
        714 900
      Z"
      fill="#F5F6FA"/>
  </g>

  <!-- Spiral rings on top -->
  
  <g>
    <!-- Drop shadow -->
    <rect x="275.8" y="148" width="56" height="160"
          rx="28" fill="#0A1C70" opacity="0.55"/>
    <!-- Ring body -->
    <rect x="272.8" y="140" width="56" height="160"
          rx="28" fill="#1A1A1A"/>
    <!-- Specular highlight -->
    <rect x="316.8" y="154" width="6" height="88"
          rx="3" fill="#4A4A4A"/>
    <!-- Inner highlight on top loop -->
    <ellipse cx="300.8" cy="152" rx="20" ry="6" fill="#5A5A5A" opacity="0.6"/>
  </g>
  <g>
    <!-- Drop shadow -->
    <rect x="416.6" y="148" width="56" height="160"
          rx="28" fill="#0A1C70" opacity="0.55"/>
    <!-- Ring body -->
    <rect x="413.6" y="140" width="56" height="160"
          rx="28" fill="#1A1A1A"/>
    <!-- Specular highlight -->
    <rect x="457.6" y="154" width="6" height="88"
          rx="3" fill="#4A4A4A"/>
    <!-- Inner highlight on top loop -->
    <ellipse cx="441.6" cy="152" rx="20" ry="6" fill="#5A5A5A" opacity="0.6"/>
  </g>
  <g>
    <!-- Drop shadow -->
    <rect x="557.4000000000001" y="148" width="56" height="160"
          rx="28" fill="#0A1C70" opacity="0.55"/>
    <!-- Ring body -->
    <rect x="554.4000000000001" y="140" width="56" height="160"
          rx="28" fill="#1A1A1A"/>
    <!-- Specular highlight -->
    <rect x="598.4000000000001" y="154" width="6" height="88"
          rx="3" fill="#4A4A4A"/>
    <!-- Inner highlight on top loop -->
    <ellipse cx="582.4000000000001" cy="152" rx="20" ry="6" fill="#5A5A5A" opacity="0.6"/>
  </g>
  <g>
    <!-- Drop shadow -->
    <rect x="698.2" y="148" width="56" height="160"
          rx="28" fill="#0A1C70" opacity="0.55"/>
    <!-- Ring body -->
    <rect x="695.2" y="140" width="56" height="160"
          rx="28" fill="#1A1A1A"/>
    <!-- Specular highlight -->
    <rect x="739.2" y="154" width="6" height="88"
          rx="3" fill="#4A4A4A"/>
    <!-- Inner highlight on top loop -->
    <ellipse cx="723.2" cy="152" rx="20" ry="6" fill="#5A5A5A" opacity="0.6"/>
  </g>
</svg>
