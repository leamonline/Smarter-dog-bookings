<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="yellowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFCC42"/>
      <stop offset="1" stop-color="#F0AE10"/>
    </linearGradient>
    <linearGradient id="foldGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#C7CCD8"/>
      <stop offset="1" stop-color="#EEF0F5"/>
    </linearGradient>
    <clipPath id="paperClip">
      <path d="
        M 188 210
        H 836
        Q 884 210 884 258
        V 790
        L 744 930
        H 188
        Q 140 930 140 882
        V 258
        Q 140 210 188 210
        Z"/>
    </clipPath>
  </defs>

  <!-- Royal-blue background, iOS-safe rounded square -->
  <rect x="0" y="0" width="1024" height="1024" rx="180" ry="180" fill="#1F3DDD"/>

  <!-- Soft drop shadow under the paper -->
  <path d="
    M 188 232
    H 836
    Q 888 232 888 280
    V 812
    L 744 952
    H 188
    Q 136 952 136 904
    V 280
    Q 136 232 188 232 Z"
    fill="#0A1C70" opacity="0.42"/>

  <g clip-path="url(#paperClip)">
    <!-- White paper body -->
    <rect x="140" y="210" width="744" height="720" fill="#FFFFFF"/>

    <!-- Yellow header band -->
    <rect x="140" y="210" width="744" height="184" fill="url(#yellowGrad)"/>
    <!-- Crisp separator under the band -->
    <rect x="140" y="394" width="744" height="3" fill="#A77807" opacity="0.5"/>

    <!-- Hole-punches -->
    
    <g>
      <!-- Soft cast shadow inside the hole -->
      <ellipse cx="288.8" cy="310" rx="31" ry="31" fill="#5C3F02" opacity="0.55"/>
      <!-- Hole interior -->
      <circle cx="288.8" cy="306" r="30" fill="#1F1206"/>
      <!-- Subtle top rim highlight (paper edge catching light) -->
      <path d="M 262.8 302
               A 26 26 0 0 1 314.8 302"
            fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.45" stroke-linecap="round"/>
    </g>
    <g>
      <!-- Soft cast shadow inside the hole -->
      <ellipse cx="437.6" cy="310" rx="31" ry="31" fill="#5C3F02" opacity="0.55"/>
      <!-- Hole interior -->
      <circle cx="437.6" cy="306" r="30" fill="#1F1206"/>
      <!-- Subtle top rim highlight (paper edge catching light) -->
      <path d="M 411.6 302
               A 26 26 0 0 1 463.6 302"
            fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.45" stroke-linecap="round"/>
    </g>
    <g>
      <!-- Soft cast shadow inside the hole -->
      <ellipse cx="586.4000000000001" cy="310" rx="31" ry="31" fill="#5C3F02" opacity="0.55"/>
      <!-- Hole interior -->
      <circle cx="586.4000000000001" cy="306" r="30" fill="#1F1206"/>
      <!-- Subtle top rim highlight (paper edge catching light) -->
      <path d="M 560.4000000000001 302
               A 26 26 0 0 1 612.4000000000001 302"
            fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.45" stroke-linecap="round"/>
    </g>
    <g>
      <!-- Soft cast shadow inside the hole -->
      <ellipse cx="735.2" cy="310" rx="31" ry="31" fill="#5C3F02" opacity="0.55"/>
      <!-- Hole interior -->
      <circle cx="735.2" cy="306" r="30" fill="#1F1206"/>
      <!-- Subtle top rim highlight (paper edge catching light) -->
      <path d="M 709.2 302
               A 26 26 0 0 1 761.2 302"
            fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.45" stroke-linecap="round"/>
    </g>

    <!-- Bold royal-blue paw print -->
    <g transform="translate(512 686)" fill="#1F3DDD">
      <!-- Main pad -->
      <ellipse cx="0" cy="92" rx="158" ry="126"/>
      <!-- Outer side toes -->
      <ellipse cx="-168" cy="-30" rx="62" ry="84" transform="rotate(-22 -168 -30)"/>
      <ellipse cx="168"  cy="-30" rx="62" ry="84" transform="rotate(22 168 -30)"/>
      <!-- Inner top toes -->
      <ellipse cx="-60" cy="-130" rx="58" ry="78"/>
      <ellipse cx="60"  cy="-130" rx="58" ry="78"/>
    </g>
  </g>

  <!-- Page-fold triangle (visible because the clip path cut the corner) -->
  <!-- Paper back -->
  <path d="
    M 744 930
    L 884 790
    L 884 930
    Z" fill="url(#foldGrad)"/>
  <!-- Fold edge shadow -->
  <line x1="744" y1="930" x2="884" y2="790"
        stroke="#8C92A2" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <!-- Tiny inner highlight along the fold for definition -->
  <line x1="750" y1="926" x2="880" y2="796"
        stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
</svg>
